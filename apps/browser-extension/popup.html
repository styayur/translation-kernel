<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Translation Kernel</title>
  </head>
  <body>
    <main class="popup">
      <h1>Translation Kernel</h1>
      <p class="subtitle">Translate this page</p>
      <div class="buttons">
        <button id="translate" class="primary">Translate</button
        ><button id="stop">Stop</button><button id="restore">Restore</button>
      </div>
      <label for="mode">Display</label
      ><select id="mode">
        <option value="original">Original</option>
        <option value="translation">Translation</option>
        <option value="bilingual" selected>Bilingual</option>
      </select>
      <div id="actions"></div>
      <p id="status" role="status" aria-live="polite">Ready</p>
      <button id="settings">Settings</button>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
