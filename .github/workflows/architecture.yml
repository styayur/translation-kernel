name: Architecture documentation
on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/architecture.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check source anchors, references and repeatable Mermaid rendering
        run: python docs/architecture/verify.py --render --chrome "C:/Program Files/Google/Chrome/Application/chrome.exe"
